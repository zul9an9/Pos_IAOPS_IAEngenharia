# Fixture 04 — apenas violações de severidade "recomendado".
# É o teste que prova que aviso não reprova: o exit code tem de continuar 0.
# Sem PDB no arquivo, contêiner com nome genérico, sem anotação de dono,
# sem terminationGracePeriodSeconds e ServiceAccount default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helio-billing
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: helio-billing
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helio-billing
      app.kubernetes.io/instance: helio-prod
      app.kubernetes.io/part-of: helio
      app.kubernetes.io/managed-by: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helio-billing
        app.kubernetes.io/instance: helio-prod
        app.kubernetes.io/part-of: helio
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.metacortex.io/helio/billing@sha256:9f2c4b7e18d0a3c56f9b2e847d1c0a5b3e6f8d2947c1b0a6e5d4f3c2b1a09876
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 150m, memory: 192Mi}
            limits:   {cpu: 600m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: helio-billing
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: helio-billing
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helio-billing
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
  ports:
    - port: 80
      targetPort: 8080
