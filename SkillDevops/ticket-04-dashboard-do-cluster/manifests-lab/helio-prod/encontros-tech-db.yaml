# Adaptação de laboratório (cluster kind, sem acesso ao registry interno):
#   registry.metacortex.io/helio/encontros-tech-db  ->  postgres:16-alpine
# O docker-compose.yml original (removido do repositório, ver commit anterior a
# "Removendo Docker") usava postgres:15-alpine; aqui padronizado em postgres:16-alpine
# por instrução do laboratório — upgrade compatível para o schema simples deste projeto
# (uma única tabela "events"). Imagem oficial pública, fixada por digest para imutabilidade
# (MC-ID-05). `conferir.py` vai acusar MC-ID-05 pelo prefixo do registry: falha esperada e
# aceita neste laboratório (mesmo caso de encontros-tech-app.yaml).
#
# Banco junto da aplicação (decisoes.md #4): StatefulSet com PVC, Service headless,
# replicas:1 com metacortex.io/excecao-replicas. UID/GID do usuário postgres na imagem
# alpine é 70. PGDATA aponta para um subdiretório do volume para não colidir com o
# "lost+found" que alguns provisionadores de PV criam na raiz.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helio-encontros-tech-db
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: metacortex-platform
    metacortex.io/cliente: helio
    metacortex.io/ambiente: prod
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helio-encontros-tech-db
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: metacortex-platform
    metacortex.io/cliente: helio
    metacortex.io/ambiente: prod
  annotations:
    metacortex.io/owner: "<definir-com-o-cliente-helio>"
    metacortex.io/excecao-replicas: >-
      banco single-instance de laboratório para encontros-tech; ver Padrão de Manifests,
      decisoes.md #4 — PDB de minAvailable:1 não traz benefício com uma única réplica.
spec:
  serviceName: helio-encontros-tech-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: helio-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: helio-prod
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: encontros-tech
        app.kubernetes.io/managed-by: metacortex-platform
        metacortex.io/cliente: helio
        metacortex.io/ambiente: prod
    spec:
      serviceAccountName: helio-encontros-tech-db
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          ports:
            - {name: postgresql, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              value: encontros_tech
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: helio-encontros-tech-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: helio-encontros-tech-db, key: password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: helio-prod
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: encontros-tech
          app.kubernetes.io/managed-by: metacortex-platform
          metacortex.io/cliente: helio
          metacortex.io/ambiente: prod
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: helio-encontros-tech-db
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: metacortex-platform
    metacortex.io/cliente: helio
    metacortex.io/ambiente: prod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: helio-prod
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
