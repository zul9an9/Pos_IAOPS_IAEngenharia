# SOMENTE PARA O LABORATÓRIO: valida o cenário "credencial restrita a um
# namespace" (tarefa 8.9). A ServiceAccount lê só nyx-prod e NÃO pode listar
# namespaces. Aplicado manualmente por quem opera; o painel não aplica nada.
apiVersion: v1
kind: Namespace
metadata:
  name: painel-cluster
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: painel-so-nyx-prod
  namespace: painel-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: painel-cluster-somente-leitura
  namespace: nyx-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: painel-so-nyx-prod
  namespace: nyx-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: painel-cluster-somente-leitura
subjects:
  - kind: ServiceAccount
    name: painel-so-nyx-prod
    namespace: painel-cluster
