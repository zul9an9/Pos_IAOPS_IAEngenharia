# ClusterRole de exemplo do painel do cluster: SOMENTE LEITURA.
#
# Concede apenas get/list/watch, sem curingas, e apenas nos recursos que o
# painel lê. Revise e aplique você mesmo (kubectl apply -f); o painel nunca
# aplica nada. Veja deploy/lab/README.md para gerar um kubeconfig com esta
# ServiceAccount.
#
# Sobre o verbo `watch`: ele entra por fazer parte do conjunto canônico de
# leitura do Kubernetes (o mesmo do papel embutido `view`), não porque o
# painel o use. O painel NÃO abre watch: a coleta é sob demanda, e o teste
# tests/test_somente_leitura.py falha se aparecer `watch.Watch` ou
# `watch=True` no código.
apiVersion: v1
kind: Namespace
metadata:
  name: painel-cluster
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: painel-cluster
  namespace: painel-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: painel-cluster-somente-leitura
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: painel-cluster-somente-leitura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: painel-cluster-somente-leitura
subjects:
  - kind: ServiceAccount
    name: painel-cluster
    namespace: painel-cluster
