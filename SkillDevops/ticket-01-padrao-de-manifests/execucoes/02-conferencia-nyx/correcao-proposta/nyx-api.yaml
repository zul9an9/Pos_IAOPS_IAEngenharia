# Correção do manifesto barrado. Cada mudança cita a regra do padrão (rev. 2026-07-29) e, quando
# veio da leitura do kube-news, o arquivo:linha (ver ../relatorio-conferencia.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api                          # 3.5
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false      # 3.4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api                          # 1.1 (era NyxAPI)
  namespace: nyx-prod
  labels:                                # 1.3
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    app: nyx-api                         # compatibilidade com seletores antigos (1.3 permite)
  annotations:
    metacortex.io/owner: cliente-nyx     # 1.5
spec:
  replicas: 2                            # 2.3
  strategy:                              # 2.4
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:                         # 1.4: idêntico ao template
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyx-api
        app.kubernetes.io/instance: nyx-prod
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
        app: nyx-api
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api                                     # 1.6
          image: registry.metacortex.io/nyx/api:1.0.0   # 3.1: tag real publicada pelo Loom
          ports:
            - {name: http, containerPort: 8080}         # src/server.js:81
          env:
            # 3.3 + leitura do projeto: o kube-news NÃO lê DATABASE_URL (nem em texto, nem via
            # secretKeyRef como no exemplo do padrão). Lê DB_* (src/models/post.js:8-13) e,
            # sem elas, conecta em localhost.
            - {name: DB_HOST, value: pg.nyx-prod.svc}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_DATABASE, value: nyx}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: nyx-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: nyx-db, key: password}}
          readinessProbe:                               # 2.2: src/system-life.js:11
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:                                # 2.2: src/system-life.js:22, não toca banco
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:                                    # 2.1: valores iniciais, recalibrar por consumo
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:                              # 3.2
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: nyx-api
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  selector:                              # 1.4: era app=nyx-api contra pods app=nyxapi
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nyx-api                          # 2.5
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-prod
