# fake-shop (Flask + gunicorn). Decisões em ../../decisoes.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: cliente-orion
spec:
  replicas: 2                          # 2.3
  strategy:                            # 2.4
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:                       # 1.4: idêntico ao template
      app.kubernetes.io/name: orion-web
      app.kubernetes.io/instance: orion-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-web
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: orion-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # A migração sai do entrypoint.sh (sem 'set -e': migração falha e o gunicorn sobe assim
      # mesmo) e vira initContainer: falhou, o pod não fica pronto nem recebe tráfego.
      initContainers:
        - name: migrate
          image: registry.metacortex.io/orion/fake-shop:1.0.0
          command: ["python", "-m", "flask", "db", "upgrade"]
          env: &env
            - {name: DB_HOST, value: orion-postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: ecommerce}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: orion-fake-shop-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: orion-fake-shop-db, key: password}}
            - {name: FLASK_APP, value: index.py}
            # index.py instancia GunicornPrometheusMetrics no import: o diretório precisa existir
            # e ser gravável inclusive no initContainer.
            - {name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/metrics}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: metrics, mountPath: /tmp/metrics}
      containers:
        - name: web                    # 1.6
          image: registry.metacortex.io/orion/fake-shop:1.0.0
          # Mesmo comando do entrypoint.sh, sem a migração. gunicorn drena workers no SIGTERM
          # (graceful_timeout padrão 30s), compatível com o terminationGracePeriod padrão (2.6).
          command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5000", "index:app"]
          ports:
            - {name: http, containerPort: 5000}
          env: *env
          # 2.2 sem endpoint de saúde no projeto (decisoes.md D1):
          #  /metrics é servido pelo processo e não toca o banco -> startup e liveness;
          #  /        consulta o catálogo no banco         -> readiness.
          startupProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}              # heartbeat dos workers do gunicorn
            - {name: metrics, mountPath: /tmp/metrics}  # PROMETHEUS_MULTIPROC_DIR
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: metrics, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
spec:
  minAvailable: 1                      # 2.5
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-web
      app.kubernetes.io/instance: orion-prod
