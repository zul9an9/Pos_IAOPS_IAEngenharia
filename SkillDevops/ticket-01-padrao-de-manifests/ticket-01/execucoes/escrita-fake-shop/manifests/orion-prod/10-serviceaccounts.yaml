# 3.4 / 3.5 — uma ServiceAccount por workload, sem token montado e sem RBAC
# (nenhum dos dois fala com o apiserver).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-web
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-postgres
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-postgres
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
automountServiceAccountToken: false
